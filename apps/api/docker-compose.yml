services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fluvi
      POSTGRES_PASSWORD: fluvi
      POSTGRES_DB: fluvi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluvi -d fluvi"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: fluvi
      POSTGRES_PASSWORD: fluvi
      POSTGRES_DB: fluvi_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-data:
